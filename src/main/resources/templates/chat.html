<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>Arena of Music</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0 mt-5">
        <div class="container my-5">
            <div class="row align-items-start d-flex justify-content-center p-2 rounded ">
                <section style="max-width: 600px;">
                    <div class="d-flex align-items-center text-center mb-3">
                        <!-- Botón de volver -->
                        <a th:href="@{/amigos}" class="btn text-decoration-none shadow-none border-0 me-3">
                            <i class="bi bi-arrow-left-circle fs-4"></i>
                        </a>

                        <!-- Imagen de perfil -->
                        <img th:src="${friend.profileImage} != null ? @{${friend.profileImage}} : @{/img/default-profile.png}"
                            th:alt="${friend.username} != null ? 'Foto de perfil de ' + ${friend.username} : 'Foto de perfil por defecto'"
                            class="rounded-circle me-3" width="40" height="40">

                        <!-- Nombre de usuario y roles -->
                        <div class="d-flex align-items-center">
                            <h2 class="fw-semibold mb-0 me-3" th:text="${friend.username}"></h2>
                            <span th:each="role : ${#strings.arrayJoin(friend.roles, ',').split(',')}" th:styleappend="|background-color: ${
                                role == 'ROOT' ? 'var(--bs-danger)' : 
                                (role == 'ADMIN' ? 'var(--bs-warning)' : 'var(--bs-primary)')
                            }; 
                            color: ${
                                role == 'ADMIN' ? 'black' : 'white'
                            }; 
                            margin-right: 0.25rem;|" class="badge" th:text="${role}">
                            </span>
                        </div>
                    </div>

                    <!-- Mensajes -->
                    <div id="chatBox" class="border rounded p-3 mb-2 d-flex flex-column gap-2"
                        style="height: 400px; overflow: auto;">
                    </div>

                    <!-- Escribir nuevo mensaje -->
                    <div class="input-group">
                        <textarea id="message" class="form-control shadow-none" rows="1"
                            placeholder="Escribe un mensaje..."></textarea>
                        <button class="btn btn-primary" onclick="sendMessage()">Enviar</button>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <th:block th:replace="~{fragments/footer.html :: footer}" />

    <script th:inline="javascript">
        const friendName = /*[[${friend.username}]]*/ "friend";
        const myName = /*[[${u.username}]]*/ "me";

        function markRead() {
            fetch(`${config.rootUrl}/chat/${friendName}/messages`, {
                method: "GET",
                credentials: "same-origin"
            })
                .catch(error => console.error(error));
        }

        ws.subscribe(`/user/queue/updates`, (m) => {
            if (m.type !== "message") return;
            if (m.from !== friendName && m.to !== myName) return;

            appendMessage(m.data);

            if (m.to === myName) {
                markRead();
            }
        });

        function appendMessage({ from, text, sent }) {
            const box = document.getElementById("chatBox");
            const time = new Date(sent).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
            const mine = (from === myName);

            const wrapper = document.createElement("div");
            wrapper.className = mine ? "msg-out" : "msg-in";

            const bubble = document.createElement("div");
            bubble.className = "msg-bubble";
            bubble.textContent = text;

            const timeElement = document.createElement("div");
            timeElement.className = "msg-time";
            timeElement.textContent = time;

            bubble.appendChild(timeElement);
            wrapper.appendChild(bubble);
            box.appendChild(wrapper);

            box.scrollTop = box.scrollHeight; // bajar al último mensaje
        }

        // Enviar mensaje
        function sendMessage() {
            const msgText = document.getElementById("message");
            const message = msgText.value.trim();
            if (!message) return;

            go(`${config.rootUrl}/chat/${friendName}/messages`, "POST", { message })
                .then(() => {
                    appendMessage({
                        from: myName,
                        text: message,
                        sent: new Date().toISOString()
                    });
                    msgText.value = "";
                })
                .catch(() => alert("Error al enviar"));
        }

        // Historial
        function loadHistory() {
            go(`${config.rootUrl}/chat/${friendName}/messages`, "GET")
                .then(messages => messages.forEach(appendMessage))
                .catch((error) => console.error(error));
            go(`${config.rootUrl}/user/unread`, "GET").then(d => {
                handleUnreadMessages(d.unread);
            });
        }

        // Enviar mensaje al pulsar enter
        document.getElementById("message").addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        document.addEventListener("DOMContentLoaded", () => {
            loadHistory();
        });

    </script>
</body>
