<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>Arena of Music</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
    <!-- <style>
        /* Borde negro más visible para el botón seleccionado */
        .btn-check:checked+.btn {
            border: 15px solid #000 !important;
            box-shadow: 0 0 0 0.15rem #0002;
        }
    </style> -->
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>
    <main class="flex-shrink-0">
        <div class="container mt-5">
            <h2 class="fw-bold">Configuración de partida</h2>
            <div
                th:replace="~{fragments/configuracion.html :: formularioConfiguracion(${modo}, ${playlists}, 'configuracion')}">
            </div>
        </div>
    </main>
    <script>
        // Mostrar valores dinámicamente
        const maxPlayersInput = document.getElementById("maxPlayers");
        const maxPlayersValue = document.getElementById("maxPlayersValue");
        maxPlayersInput.addEventListener("input", () => maxPlayersValue.textContent = maxPlayersInput.value);

        const rondasInput = document.getElementById("rounds");
        const rondasValue = document.getElementById("roundsValue");
        rondasInput.addEventListener("input", () => rondasValue.textContent = rondasInput.value);

        const tiempoInput = document.getElementById("time");
        const tiempoValue = document.getElementById("timeValue");
        tiempoInput.addEventListener("input", () => tiempoValue.textContent = tiempoInput.value);
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const playlists = document.querySelectorAll('.playlist-radio');

            playlists.forEach(radio => {
                const img = radio.nextElementSibling.querySelector('img');
                const playlistId = radio.value;

                fetch(`/partida/playlist/${playlistId}/cover`)
                    .then(response => {
                        if (!response.ok) throw new Error('Error al cargar imagen');
                        return response.blob();
                    })
                    .then(blob => {
                        const imageUrl = URL.createObjectURL(blob);
                        img.src = imageUrl;
                    })
                    .catch(error => {
                        console.error('Error obteniendo carátula:', error);
                        img.src = '/img/default-profile.png'; // Imagen por defecto en caso de error
                    });
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById('formConfiguracionPartida');

            form.addEventListener('submit', function (event) {
                event.preventDefault();

                // Obtenemos los valores del formulario
                const selectedPlaylistInput = document.querySelector('input[name="selectedPlaylist"]:checked');
                const answerModeInput = document.querySelector('input[name="answerMode"]:checked');
                const answerTypeInput = document.querySelector('input[name="answerType"]:checked');

                const playlistId = selectedPlaylistInput ? selectedPlaylistInput.value : null;
                const maxPlayers = document.getElementById('maxPlayers').value;
                const rondas = document.getElementById('rounds').value;
                const tiempo = document.getElementById('time').value;
                const answerMode = answerModeInput ? answerModeInput.value : null;
                const answerType = answerTypeInput ? answerTypeInput.value : null;

                // Validaciones
                if (!playlistId || !maxPlayers || !rondas || !tiempo || !answerMode || !answerType) {
                    showErrorNotification('Por favor, completa todos los campos.', 'warning');
                    return;
                }

                if (isNaN(maxPlayers) || isNaN(rondas) || isNaN(tiempo) || rondas <= 0 || tiempo <= 0) {
                    showErrorNotification('Las rondas y el tiempo deben ser números positivos.', 'warning');
                    return;
                }

                // Obtener el token CSRF
                const csrfToken = config.csrf.value;

                // Crear la petición
                const formData = new URLSearchParams();
                formData.append('playlistId', playlistId);
                formData.append('rondas', rondas);
                formData.append('tiempo', tiempo);
                formData.append('maxPlayers', maxPlayers);
                formData.append('gameAnswerMode', answerMode);
                formData.append('answerType', answerType);

                fetch('/partida/crear-partida', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-CSRF-TOKEN': csrfToken
                    },
                    body: formData
                }).then(response => {
                    if (response.redirected) {
                        window.location.href = response.url;
                    }
                }).catch(error => {
                    console.error('Error al crear la partida:', error);
                    showErrorNotification('Hubo un error al crear la partida. Intenta nuevamente.', 'danger');
                });
            });
        });

    </script>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
</body>

</html>
