<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Nav fragment - rest intentionally left empty</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column h-100">

    <header th:fragment="nav">
        <nav class="navbar navbar-expand-lg shadow-sm">
            <div class="container-fluid text-center align-items-center">
                <!-- Logo and Site Name -->
                <a class="navbar-brand" th:href="@{/}" id="logo">
                    <img th:src="@{/img/logo.jpeg}" src="/img/logo.jpeg" alt="logo IW" width="32" height="32"
                        class="d-inline-block align-text-top rounded-circle">
                </a>

                <!-- Responsive menu button -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu items aligned to the left -->
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a id="home" class="nav-link" th:href="@{/}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                    class="bi bi-house" viewBox="0 0 16 16">
                                    <path
                                        d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
                                </svg>
                            </a>
                        </li>

                        <th:block th:if="${u}">
                            <li class="nav-item">
                                <a id="friends" class="nav-link" th:href="@{/amigos}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                                        class="bi bi-people" viewBox="0 0 16 16">
                                        <path
                                            d="M15 14s1 0 1-1-1-4-5-4-5 3-5 4 1 1 1 1zm-7.978-1L7 12.996c.001-.264.167-1.03.76-1.72C8.312 10.629 9.282 10 11 10c1.717 0 2.687.63 3.24 1.276.593.69.758 1.457.76 1.72l-.008.002-.014.002zM11 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4m3-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0M6.936 9.28a6 6 0 0 0-1.23-.247A7 7 0 0 0 5 9c-4 0-5 3-5 4q0 1 1 1h4.216A2.24 2.24 0 0 1 5 13c0-1.01.377-2.042 1.09-2.904.243-.294.526-.569.846-.816M4.92 10A5.5 5.5 0 0 0 4 13H1c0-.26.164-1.03.76-1.724.545-.636 1.492-1.256 3.16-1.275ZM1.5 5.5a3 3 0 1 1 6 0 3 3 0 0 1-6 0m3-2a2 2 0 1 0 0 4 2 2 0 0 0 0-4" />
                                    </svg>
                                    <span id="nav-unread" class="badge bg-danger notification-badge d-none">0</span>
                                    <span id="nav-friend-requests" class="friend-request-dot d-none">&#8203;</span>
                                </a>
                            </li>
                        </th:block>
                    </ul>

                    <!-- Right-aligned items (Admin, Logout, Login) -->
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                        <!-- If user is logged in -->
                        <th:block th:if="${u}">
                            <li id="exp" class="nav-item d-none" th:text="|${u.EXP_total} EXP|"></li>
                            <li class="nav-item">
                                <a id="profile" class="nav-link" th:href="@{/perfil}">
                                    <img th:src="${u.profileImage} != null ? @{${u.profileImage}} : @{/img/default-profile.png}"
                                        th:alt="${u.username} != null ? 'Foto de perfil de ' + ${u.username} : 'Foto de perfil por defecto'"
                                        class="rounded-circle" width="32" height="32">
                                </a>
                            </li>
                            <!-- Admin button -->
                            <li class="nav-item align-self-center me-2" th:if="${u.hasRole('ADMIN')}">
                                <div class="btn-group">
                                    <a class="btn btn-secondary" th:href="@{/admin/}">
                                        Administración
                                    </a>
                                    <button type="button"
                                        class="btn btn-secondary dropdown-toggle dropdown-toggle-split"
                                        data-bs-toggle="dropdown" aria-expanded="false">
                                        <span class="visually-hidden">Toggle Dropdown</span>
                                    </button>
                                    <ul class="dropdown-menu">
                                        <li>
                                            <a class="dropdown-item" th:href="@{/admin/playlists}">Playlists</a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" th:href="@{/admin/users}">Administrar usuarios</a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" th:href="@{/admin/reports}">Reportes</a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" th:href="@{/admin/shop}">Tienda</a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" th:href="@{/admin/spectate}">Espectar partidas</a>
                                        </li>
                                        <li>
                                            <a class="dropdown-item" th:href="@{/admin/stats}">Estatisticas
                                                generales</a>
                                        </li>
                                    </ul>
                                </div>
                            </li>

                            <!-- Logout -->
                            <li class="nav-item">
                                <form th:action="@{/logout}" method="post">
                                    <button id="logout" type="submit" class="btn btn-outline-danger btn-sm">Cerrar
                                        sesión</button>
                                </form>
                            </li>

                        </th:block>

                        <!-- If user is NOT logged in -->
                        <th:block th:unless="${u}">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/login}">Login</a>
                            </li>
                            <li class="nav-item debug" th:if="${application.debug}">
                                <form class="d-flex" th:action="@{/login}" method="post">
                                    <input type="hidden" name="username" value="a">
                                    <input type="hidden" name="password" value="aa">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">a</button>
                                </form>
                            </li>
                            <li class="nav-item debug" th:if="${application.debug}">
                                <form class="d-flex" th:action="@{/login}" method="post">
                                    <input type="hidden" name="username" value="b">
                                    <input type="hidden" name="password" value="aa">
                                    <button type="submit" class="btn btn-outline-danger btn-sm">b</button>
                                </form>
                            </li>
                        </th:block>
                    </ul>
                </div>
            </div>
        </nav>
        <script th:if="${u}" th:inline="javascript">
            let tooltipFriends = null;
            let friendRequests = 0;
            let unreadMessages = 0;

            function handleUnreadMessages(unread) {
                const u = document.getElementById('nav-unread');
                unreadMessages = unread;
                if (unread > 0) {
                    u.textContent = unread > 99 ? '99+' : unread;
                    u.classList.remove('d-none');
                } else {
                    u.classList.add('d-none');
                }
                toggleTooltipFriends();
            }

            function handleFriendRequests(requests) {
                const u = document.getElementById('nav-friend-requests');
                friendRequests = requests;
                if (requests > 0) {
                    u.classList.remove('d-none');
                } else {
                    u.classList.add('d-none');
                }
                toggleTooltipFriends();
            }

            function toggleTooltipFriends() {
                if (tooltipFriends) {
                    tooltipFriends.dispose();
                    tooltipFriends = null;
                }
                if (friendRequests || unreadMessages) {
                    tooltipFriends = new bootstrap.Tooltip(document.getElementById('friends'), {
                        title: `<div class="d-flex flex-column align-items-center text-center">
                        ${unreadMessages ? '<span class="badge bg-primary mb-1">Tienes ' + unreadMessages + ' mensaje' + (unreadMessages > 1 ? 's' : '') + ' sin leer</span>' : ''}
                        ${friendRequests ? '<span class="badge bg-secondary">Tienes solicitudes de amistad pendientes</span>' : ''}
                        </div>`,
                        html: true,
                        placement: 'bottom',
                        trigger: 'hover',
                        customClass: 'large-tooltip',
                        fallbackPlacements: [],
                        boundary: 'viewport'
                    });
                } else {
                    tooltipFriends = null;
                }
            }

            document.addEventListener('DOMContentLoaded', () => {
                const expElement = document.getElementById('exp');
                const id = /*[[${u.id}]]*/ null;
                const myName = /*[[${u.username}]]*/ "myUsername";

                if (expElement) {
                    go(`/user/${id}/exp`, 'GET').then(data => {
                        expElement.textContent = `${data.exp} EXP`;
                    });
                    expElement.classList.remove('d-none');
                }

                let unread = document.querySelector("#nav-unread");
                if (unread) {
                    go(`${config.rootUrl}/user/unread`, "GET").then(d => {
                        handleUnreadMessages(d.unread);
                    });
                }

                let fr = document.querySelector("#nav-friend-requests");
                if (fr) {
                    go(config.rootUrl + "/amigos/list", "POST", { view: "solicitudes", search: "" })
                        .then(r => {
                            handleFriendRequests(r.length);
                        });
                }

                ws.subscribe("/user/queue/updates", (m) => {
                    switch (m.type) {
                        case "message":
                            const message = m.data;
                            if (message.from === myName) return;
                            if (message.to !== myName) return;
                            handleUnreadMessages(unreadMessages + 1);
                            break;
                        case "friendRequest":
                            showErrorNotification(`Solicitud de amistad de ${m.from} recibida`, 'info');
                            handleFriendRequests(friendRequests + 1);
                            break;
                        case "friendRequestAccepted":
                        case "friendRequestRejected":
                            showErrorNotification(`${m.from} ha ${m.type === 'friendRequestAccepted' ? 'aceptado' : 'rechazado'} tu solicitud de amistad`, 'info');
                            break;
                    }
                });
            });
        </script>
    </header>
</body>

</html>
