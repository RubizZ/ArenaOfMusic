<!DOCTYPE html>
<html class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>Arena of Music</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
</head>

<body class="d-flex flex-column h-100">
    <header th:replace="~{fragments/nav.html :: nav}"></header>

    <main class="flex-shrink-0 mt-5">
        <div class="container my-5" style="margin-right: 50px;">
            <div class="d-flex justify-content-center align-items-center mb-2">
                <h2 class="fw-bold mb-0">Sala de Espera</h2>
            </div>
            <div class="row align-items-start p-2 rounded">
                <div class="col-md-5 offset-md-1">

                    <p class="text-muted mb-3 fs-5">Esperando a otros jugadores...</p>

                    <!-- Información de la partida -->
                    <div class="d-flex align-items-center mb-4">
                        <img th:src="@{/img/preview-song-img.jpeg}" class="rounded me-3"
                            style="width: 100px; height: 100px; object-fit: cover;" id="playlistCover" />
                        <div>
                            <h5 class="fw-bold mb-1 fs-4" th:text="${playlist.name}">Título</h5>
                            <p style="display: none;" th:text="${playlist.id}" id="playlistId"></p>
                            <p class="text-muted mb-0 small"
                                th:text="|${gameConfig.rounds} rondas • Fragmentos de canción de ${gameConfig.fragmentDuration} segundos|">
                                Rondas
                            </p>
                        </div>
                    </div>

                    <!-- Lista de jugadores -->
                    <ul class="list-group mb-3">
                        <li class="list-group-item d-flex align-items-center border-0" th:each="player : ${players}">
                            <div class="d-flex align-items-center">
                                <img th:src="@{/img/default-profile.png}" alt="Foto de perfil de jugador"
                                    class="rounded-circle me-3" style="width: 55px; height: 55px; object-fit: cover;">
                                <div>
                                    <div class="fw-semibold fs-6" th:text="${player.username}">Nombre</div>
                                    <div class="text-muted small">
                                        <span th:text="${'Total EXP: ' + player.EXP_total}">Total EXP</span>
                                        <span> • </span>
                                        <span th:text="${'Victorias: ' + player.totalWins}"></span>
                                    </div>
                                </div>
                        </li>
                    </ul>
                </div>


                <!-- Modo de juego -->
                <div class="col-md-3 mt-5 offset-md-1 d-flex flex-column justify-content-center align-items-center">
                    <!-- Código -->
                    <div class="text-start ms-3">
                        <span class="badge bg-secondary px-4 py-3 rounded-pill" style="font-size: 1.0rem;"
                            th:text="|CÓDIGO: ${gameId}|"></span>
                    </div>

                    <div class="bg-secondary p-4 rounded mt-4 text-center" style="max-width: 200px; max-height: 250px;">
                        <!-- Opciones múltiples -->
                        <div th:if="${gameConfig.gameMode == 'options'}">
                            <div class="d-flex justify-content-center mb-4 mt-3">
                                <i class="bi bi-list-ul" style="font-size: 50px;"></i>
                            </div>
                            <h5 class="fw-bold mb-3 fs-6">Opciones múltiples</h5>
                            <p class="text-muted mb-4 small">Elige entre 4 opciones posibles</p>
                        </div>

                        <!-- Adivina la canción -->
                        <div th:if="${gameConfig.gameMode == 'song'}">
                            <div class="d-flex justify-content-center mb-4 mt-3">
                                <i class="bi bi-music-note-beamed" style="font-size: 50px;"></i>
                            </div>
                            <h5 class="fw-bold mb-3 fs-6">Adivina la canción</h5>
                            <p class="text-muted mb-4 small">Escribe el nombre de la canción</p>
                        </div>

                        <!-- Adivina el artista -->
                        <div th:if="${gameConfig.gameMode == 'artist'}">
                            <div class="d-flex justify-content-center mb-4 mt-3">
                                <i class="bi bi-person-fill" style="font-size: 50px;"></i>
                            </div>
                            <h5 class="fw-bold mb-3 fs-6">Adivina el artista</h5>
                            <p class="text-muted mb-4 small">Escribe el nombre del artista de la canción</p>
                        </div>
                    </div>

                    <!-- Comenzar partida -->
                    <div class="text-start mt-4">
                        <form th:action="@{/partida/iniciar/{gameId}(gameId=${gameId})}" method="post">
                            <button class="btn btn-accept fw-bold rounded-4 text-dark" id="startButton" type="submit">
                                Comenzar partida
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const playlistImg = document.getElementById('playlistCover');
            const playlistId = document.getElementById('playlistId').textContent.trim();

            fetch(`/partida/playlist/${playlistId}/cover`)
                .then(response => {
                    if (!response.ok) throw new Error('Error al cargar imagen');
                    return response.blob();
                })
                .then(blob => {
                    const imageUrl = URL.createObjectURL(blob);
                    playlistImg.src = imageUrl;
                })
                .catch(error => {
                    console.error('Error obteniendo carátula:', error);
                    playlistImg.src = '/img/default-profile.png'; // Imagen por defecto en caso de error
                });
        });
    </script>

    <th:block th:replace="~{fragments/footer.html :: footer}" />
</body>

</html>
